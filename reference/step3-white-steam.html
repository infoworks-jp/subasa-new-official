<script>
/* STEP 3 ONLY: keep STEP2 source coordinates and upstream rendering unchanged; change emitted pointer dye to neutral white only. */
(()=>{
 const c=document.querySelector('canvas'),X=.632,Y=.486;
 config.COLORFUL=false;
 const white={r:.15,g:.15,b:.15};
 function fire(type,x,y){const r=c.getBoundingClientRect();c.dispatchEvent(new MouseEvent(type,{bubbles:true,clientX:r.left+r.width*x,clientY:r.top+r.height*y}));}
 setTimeout(()=>{fire('mousedown',X,Y+.025);let i=0;setInterval(()=>{pointers[0].color=white;const sway=Math.sin(i*.31)*.012,lift=(i%10)*.0035;fire('mousemove',X+sway,Y+.025-lift);i++;},70);},1800);
 window.__pavelMigrationStep3={source:{x:X,y:Y},color:'neutral-white',colorValue:white,visualFilter:'none',onlyChange:'color'};
})();
</script>
