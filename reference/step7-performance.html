<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<base href="https://cdn.jsdelivr.net/gh/PavelDoGreat/WebGL-Fluid-Simulation@master/">
<title>STEP 7 — performance only</title>
<script src="dat.gui.min.js"></script>
<style>*{box-sizing:border-box;user-select:none}html,body{margin:0;background:#000;min-height:230vh}#stage{position:relative;width:100%;height:100vh;overflow:hidden;background:#000 url('https://infoworks-jp.github.io/subasa-new-official/assets/tsubasa-ramen.webp') center/cover no-repeat}canvas{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen;touch-action:none}.spacer{height:130vh;background:#050303}.dg,.promo{display:none!important}</style>
<script>window.ga=function(){};</script>
</head>
<body>
<div id="stage"><canvas></canvas><div class="promo"><span class="promo-close">×</span><a id="apple_link"></a><a id="google_link"></a></div></div><div class="spacer"></div>
<script src="script.js"></script>
<script>
/* STEP 7 ONLY: performance. Keep STEP6 source/appearance/interaction values unchanged.
   Solver stages remain PavelDoGreat upstream. Performance changes are lower simulation/dye resolution,
   fewer Jacobi iterations, offscreen solver pause, and disabling only the optional bloom/sunrays post-processes. */
(()=>{
 const c=document.querySelector('canvas'),stage=document.getElementById('stage');
 const mobile=matchMedia('(max-width:640px)').matches;
 const X=.632,Y=.486;
 const SOURCE_FLUID_Y=1-(Y+.025);
 const DYE_AMPLITUDE=.03,EMIT_INTERVAL_MS=150,UPWARD_FORCE=10,LATERAL_FORCE=1.2,DENSITY_DISSIPATION=3.2,VELOCITY_DISSIPATION=1.0,CURL_STRENGTH=24,SPLAT_RADIUS=.04,POINTER_RADIUS=.12,POINTER_FORCE=1700;
 const SIM_RESOLUTION=mobile?64:96;
 const DYE_RESOLUTION=mobile?256:512;
 const PRESSURE_ITERATIONS=mobile?10:14;
 const BLOOM_ENABLED=false,SUNRAYS_ENABLED=false;
 const white={r:DYE_AMPLITUDE,g:DYE_AMPLITUDE,b:DYE_AMPLITUDE},noDye={r:0,g:0,b:0};
 config.COLORFUL=false;config.DENSITY_DISSIPATION=DENSITY_DISSIPATION;config.VELOCITY_DISSIPATION=VELOCITY_DISSIPATION;config.CURL=CURL_STRENGTH;config.SPLAT_RADIUS=SPLAT_RADIUS;
 config.SIM_RESOLUTION=SIM_RESOLUTION;config.DYE_RESOLUTION=DYE_RESOLUTION;config.PRESSURE_ITERATIONS=PRESSURE_ITERATIONS;config.BLOOM=BLOOM_ENABLED;config.SUNRAYS=SUNRAYS_ENABLED;
 if(Array.isArray(splatStack))splatStack.length=0;
 initFramebuffers();
 function clearFBO(target){if(!target||!target.fbo)return;gl.bindFramebuffer(gl.FRAMEBUFFER,target.fbo);gl.viewport(0,0,target.width,target.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT)}
 function zeroFluidState(){[dye?.read,dye?.write,velocity?.read,velocity?.write,pressure?.read,pressure?.write,divergence,curl].forEach(clearFBO);gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,gl.drawingBufferWidth,gl.drawingBufferHeight)}
 zeroFluidState();
 let solverActive=true,i=0,pointerSplats=0,last=null;
 function emitSteam(){if(!solverActive)return;const dx=Math.sin(i*.47)*LATERAL_FORCE+Math.sin(i*.19)*.45;const sourceX=X+Math.sin(i*.31)*.0012;const sourceY=SOURCE_FLUID_Y+Math.sin(i*.23)*.0008;splat(sourceX,sourceY,dx,UPWARD_FORCE,white);i++}
 setTimeout(()=>{emitSteam();setInterval(emitSteam,EMIT_INTERVAL_MS)},1800);
 function stir(clientX,clientY){if(!solverActive)return;const r=c.getBoundingClientRect();const x=(clientX-r.left)/r.width,y=1-(clientY-r.top)/r.height;if(x<0||x>1||y<0||y>1){last=null;return}if(!last){last={x:clientX,y:clientY};return}const dx=(clientX-last.x)/r.width,dy=-(clientY-last.y)/r.height;last={x:clientX,y:clientY};if(Math.hypot(dx,dy)<.0004)return;const vx=Math.max(-90,Math.min(90,dx*POINTER_FORCE)),vy=Math.max(-90,Math.min(90,dy*POINTER_FORCE)),saved=config.SPLAT_RADIUS;config.SPLAT_RADIUS=POINTER_RADIUS;splat(x,y,vx,vy,noDye);config.SPLAT_RADIUS=saved;pointerSplats++}
 c.addEventListener('pointermove',e=>stir(e.clientX,e.clientY),{passive:true});c.addEventListener('pointerleave',()=>last=null,{passive:true});
 const observer=new IntersectionObserver(entries=>{solverActive=entries[0].isIntersecting;config.PAUSED=!solverActive;c.style.visibility=solverActive?'visible':'hidden';if(solverActive)last=null},{threshold:.01});observer.observe(stage);
 window.__pavelMigrationStep7={source:{x:X,y:Y},dyeAmplitude:DYE_AMPLITUDE,intervalMs:EMIT_INTERVAL_MS,upwardForce:UPWARD_FORCE,lateralForce:LATERAL_FORCE,densityDissipation:DENSITY_DISSIPATION,velocityDissipation:VELOCITY_DISSIPATION,curl:CURL_STRENGTH,splatRadius:SPLAT_RADIUS,pointerRadius:POINTER_RADIUS,pointerForce:POINTER_FORCE,pointerAddsDye:false,simResolution:SIM_RESOLUTION,dyeResolution:DYE_RESOLUTION,pressureIterations:PRESSURE_ITERATIONS,bloom:BLOOM_ENABLED,sunrays:SUNRAYS_ENABLED,offscreenPause:true,upstreamSolver:true,get solverActive(){return solverActive},get pointerSplats(){return pointerSplats},onlyChange:'performance'};
})();
</script>
</body>
</html>
