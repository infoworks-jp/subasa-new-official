<style>*{user-select:none}html,body{overflow:hidden;background:#000}body{margin:0;position:fixed;width:100%;height:100%;background:#000 url('https://infoworks-jp.github.io/subasa-new-official/assets/tsubasa-ramen.webp') center/cover no-repeat}canvas{width:100%;height:100%;mix-blend-mode:screen}.dg,.promo{display:none!important}</style>

<canvas></canvas><div class="promo"><span class="promo-close">×</span><a id="apple_link"></a><a id="google_link"></a></div>
<script src="script.js"></script>
<script>
/* STEP 5 ONLY: velocity, vorticity and diffusion.
   Keep STEP4 source X=.632/Y=.486, neutral-white dye amplitude .03 and 150ms emission cadence.
   The previous 10/1.2/3.2/1.0/24 trial passed numeric geometry but visual inspection still showed a rounded mushroom cap.
   Change only the upstream splat radius from its default .25 to .04 to seed a thinner fluid strand; all other STEP5 values stay fixed. */
(()=>{
 const X=.632,Y=.486;
 const SOURCE_SCREEN_Y=Y+.025;
 const SOURCE_FLUID_Y=1-SOURCE_SCREEN_Y;
 const DYE_AMPLITUDE=.03;
 const EMIT_INTERVAL_MS=150;
 const UPWARD_FORCE=10;
 const LATERAL_FORCE=1.2;
 const DENSITY_DISSIPATION=3.2;
 const VELOCITY_DISSIPATION=1.0;
 const CURL_STRENGTH=24;
 const SPLAT_RADIUS=.04;
 const white={r:DYE_AMPLITUDE,g:DYE_AMPLITUDE,b:DYE_AMPLITUDE};

 config.COLORFUL=false;
 config.DENSITY_DISSIPATION=DENSITY_DISSIPATION;
 config.VELOCITY_DISSIPATION=VELOCITY_DISSIPATION;
 config.CURL=CURL_STRENGTH;
 config.SPLAT_RADIUS=SPLAT_RADIUS;
 if(Array.isArray(splatStack)) splatStack.length=0;

 function clearFBO(target){
   if(!target||!target.fbo)return;
   gl.bindFramebuffer(gl.FRAMEBUFFER,target.fbo);
   gl.viewport(0,0,target.width,target.height);
   gl.clearColor(0,0,0,0);
   gl.clear(gl.COLOR_BUFFER_BIT);
 }
 function zeroFluidState(){
   [dye?.read,dye?.write,velocity?.read,velocity?.write,pressure?.read,pressure?.write,divergence,curl].forEach(clearFBO);
   gl.bindFramebuffer(gl.FRAMEBUFFER,null);
   gl.viewport(0,0,gl.drawingBufferWidth,gl.drawingBufferHeight);
 }
 zeroFluidState();

 let i=0;
 let timer=null;
 function emitSteam(){
   const dx=Math.sin(i*.47)*LATERAL_FORCE + Math.sin(i*.19)*.45;
   const sourceX=X + Math.sin(i*.31)*.0012;
   const sourceY=SOURCE_FLUID_Y + Math.sin(i*.23)*.0008;
   splat(sourceX,sourceY,dx,UPWARD_FORCE,white);
   i++;
 }
 setTimeout(()=>{
   emitSteam();
   timer=setInterval(emitSteam,EMIT_INTERVAL_MS);
 },1800);

 window.__pavelMigrationStep5={
   source:{x:X,y:Y},
   sourceFluidY:SOURCE_FLUID_Y,
   color:'neutral-white',
   dyeAmplitude:DYE_AMPLITUDE,
   intervalMs:EMIT_INTERVAL_MS,
   upwardForce:UPWARD_FORCE,
   lateralForce:LATERAL_FORCE,
   densityDissipation:DENSITY_DISSIPATION,
   velocityDissipation:VELOCITY_DISSIPATION,
   curl:CURL_STRENGTH,
   splatRadius:SPLAT_RADIUS,
   upstreamSplat:true,
   explicitFramebufferZero:true,
   visualFilter:'none',
   onlyChange:'velocityVorticityDiffusion'
 };
})();
</script>
</body>
