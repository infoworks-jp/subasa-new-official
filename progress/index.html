<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>つばさ 制作状況</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.w{max-width:980px;margin:auto;padding:28px 18px 60px}h1{margin:0;font-size:clamp(27px,5vw,48px)}.live{color:#999;margin:7px 0 24px;font-size:12px}.hero{border:1px solid #333;background:#111;padding:24px;margin-bottom:14px}.state{font-size:clamp(30px,6vw,58px);font-weight:900}.ok{color:#4ade80}.bad{color:#fb7185}.run{color:#facc15}.meter{height:18px;background:#242424;margin:18px 0 8px;border-radius:20px;overflow:hidden}.meter i{height:100%;display:block;background:#4ade80;transition:.4s}.pct{font-size:22px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.c{background:#111;border:1px solid #292929;padding:15px;display:flex;justify-content:space-between;align-items:center;min-height:64px}.c span:first-child{font-weight:700}.mark{font-size:22px;font-weight:900}.bottom{margin-top:14px;padding:18px;background:#111;border:1px solid #292929}.small{color:#888;font-size:11px;line-height:1.7}a{color:#fff}.alert{background:#351014;border-color:#7f1d1d}@media(max-width:620px){.grid{grid-template-columns:1fr}.w{padding-top:20px}}</style></head><body><main class="w"><h1>味一番つばさ 新サイト</h1><div class="live">● LIVE　30秒ごと自動更新</div><section class="hero" id="hero"><div class="state run" id="state">確認中…</div><div class="meter"><i id="meter" style="width:0"></i></div><div><span class="pct" id="pct">--%</span> <span class="small" id="now">状態取得中</span></div></section><div class="grid" id="items"></div><section class="bottom"><b>自動監視</b><div style="margin-top:10px">Visual QA：<strong id="qa">--</strong>　／　Pages公開：<strong id="dep">--</strong></div><div class="small" id="time"></div><div style="margin-top:12px"><a href="../" target="_blank">▶ 公開サイトを開く</a></div></section></main><script>const A='https://api.github.com/repos/infoworks-jp/subasa-new-official/actions/runs?per_page=30';const base=[['TOP・すすきの画像',1],['縦ロゴ',1],['究極の味噌',1],['つばさラーメン',1],['料理写真',1],['店内写真',1],['日本語メニュー',1],['英語メニュー',1],['中国語メニュー',1],['韓国語メニュー',1],['本格WebGL流体＋写真歪み＋墨Reveal',0],['PC対応',1],['スマホ対応',1],['公開設定',1],['自動Visual QA',0],['公開Pages',0],['最終実画面目視',0]];function render(qa,dep){const q=qa&&qa.conclusion==='success',d=dep&&dep.conclusion==='success',fail=(qa&&qa.conclusion==='failure')||(dep&&dep.conclusion==='failure'),running=(qa&&qa.status!=='completed')||(dep&&dep.status!=='completed');const arr=base.map(x=>[...x]);arr[14][1]=q?1:running?2:0;arr[15][1]=d?1:running?2:0;const done=arr.filter(x=>x[1]===1).length,p=Math.round(done/arr.length*100);document.querySelector('#items').innerHTML=arr.map(x=>`<div class="c"><span>${x[0]}</span><span class="mark ${x[1]===1?'ok':x[1]===2?'run':'bad'}">${x[1]===1?'✓':x[1]===2?'●':'—'}</span></div>`).join('');document.querySelector('#pct').textContent=p+'%';document.querySelector('#meter').style.width=p+'%';let s='制作・検品中',cl='run',n='残り '+(arr.length-done)+' 項目';if(fail){s='異常あり';cl='bad';n='自動検査でFAILを検出'}else if(done===arr.length){s='完成';cl='ok';n='全項目確認済み'}else if(q&&d){s='制作継続中';cl='run';n='本格WebGL流体と最終目視が未完了'}document.querySelector('#state').textContent=s;document.querySelector('#state').className='state '+cl;document.querySelector('#now').textContent=n;document.querySelector('#hero').className='hero'+(fail?' alert':'');document.querySelector('#qa').textContent=q?'✓ PASS':qa&&qa.status!=='completed'?'● RUNNING':'× FAIL';document.querySelector('#dep').textContent=d?'✓ PASS':dep&&dep.status!=='completed'?'● RUNNING':'× FAIL'}async function load(){try{const r=await fetch(A,{cache:'no-store'}),j=await r.json(),rs=j.workflow_runs||[],qa=rs.find(x=>x.name==='Visual QA'),dep=rs.find(x=>x.name==='Deploy Pages');render(qa,dep);document.querySelector('#time').textContent='最終更新 '+new Date().toLocaleString('ja-JP')+(qa?' / commit '+qa.head_sha.slice(0,8):'')}catch(e){document.querySelector('#state').textContent='監視取得エラー';document.querySelector('#state').className='state bad'}}load();setInterval(load,30000)</script></body></html>
