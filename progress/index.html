<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="cache-control" content="no-cache"><title>つばさ エフェクト完成監視</title><style>*{box-sizing:border-box}body{margin:0;background:#070707;color:#f7f7f7;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.w{max-width:1100px;margin:auto;padding:28px 18px 60px}h1{margin:0;font-size:clamp(28px,5vw,52px)}.sub{color:#999;margin:8px 0 24px}.hero{padding:24px;border:1px solid #333;background:#111;margin-bottom:14px}.state{font-size:clamp(32px,7vw,64px);font-weight:900}.run{color:#facc15}.ok{color:#4ade80}.bad{color:#fb7185}.meter{height:20px;background:#252525;border-radius:20px;overflow:hidden;margin:18px 0 8px}.meter i{display:block;height:100%;background:#4ade80;transition:.4s}.pct{font-size:24px;font-weight:900}.steps{display:grid;gap:10px}.step{display:grid;grid-template-columns:54px 1fr auto;gap:14px;align-items:center;padding:18px;background:#111;border:1px solid #292929}.num{font-size:26px;font-weight:900;color:#777}.step b{display:block;font-size:18px}.step small{display:block;color:#8e8e8e;margin-top:5px;line-height:1.5}.mark{font-size:24px;font-weight:900}.panel{margin-top:14px;padding:18px;background:#111;border:1px solid #292929}.qa{display:flex;gap:24px;flex-wrap:wrap;margin-top:10px}.links{display:flex;gap:20px;flex-wrap:wrap;margin-top:16px}a{color:#fff}.tiny{font-size:11px;color:#888;margin-top:10px;line-height:1.6}@media(max-width:620px){.step{grid-template-columns:38px 1fr auto;padding:14px}.num{font-size:20px}.step b{font-size:16px}}</style></head><body><main class="w"><h1>味一番つばさ｜完成監視</h1><div class="sub">TOP墨流し → 味噌の湯気 → つばさの透明波紋 → ロゴ → PC/スマホ実画面検品</div><section class="hero"><div id="state" class="state run">監視中</div><div class="meter"><i id="bar" style="width:0"></i></div><span id="pct" class="pct">0%</span>　<span id="summary">状態取得中</span></section><section id="steps" class="steps"></section><section class="panel"><b>GitHub 自動処理</b><div class="qa">Visual QA <strong id="qa">--</strong><span>Pages公開 <strong id="dep">--</strong></span></div><div id="time" class="tiny"></div><div class="links"><a href="../" target="_blank">▶ 公開サイト</a><a href="https://github.com/infoworks-jp/subasa-new-official/actions" target="_blank">▶ Actions</a></div></section></main><script>
const API='https://api.github.com/repos/infoworks-jp/subasa-new-official/actions/runs?per_page=30';
const stages=[
['TOP墨流し','WebGL流体。黒・深紅中心。マウス／タッチで墨が引かれ渦を巻く。',1],
['味噌の湯気','ラーメン付近から白い湯気が上昇し、操作に反応する。',1],
['つばさの透明波紋','横切るライトなし。水面・透明波紋として反応する。',1],
['縦ロゴ','過剰な移動なし。ネオンが静かに灯る。',1],
['PC/スマホ実画面検品','PC・390pxスマホで実ピクセル変化、レイアウト、指定外演出なしを確認。',0]
];
function draw(qa,dep){const q=qa&&qa.conclusion==='success',d=dep&&dep.conclusion==='success',fail=(qa&&qa.conclusion==='failure')||(dep&&dep.conclusion==='failure'),running=(qa&&qa.status!=='completed')||(dep&&dep.status!=='completed');const a=stages.map(x=>[...x]);a[4][2]=(q&&d)?1:running?2:0;const done=a.filter(x=>x[2]===1).length,p=Math.round(done/a.length*100);document.querySelector('#steps').innerHTML=a.map((x,i)=>`<div class="step"><span class="num">0${i+1}</span><div><b>${x[0]}</b><small>${x[1]}</small></div><span class="mark ${x[2]===1?'ok':x[2]===2?'run':'bad'}">${x[2]===1?'✓':x[2]===2?'●':'—'}</span></div>`).join('');bar.style.width=p+'%';pct.textContent=p+'%';let s='制作・検品中',cl='run',sum='残り '+(a.length-done)+'工程';if(fail){s='異常検出';cl='bad';sum='QAまたは公開処理がFAIL'}else if(done===a.length){s='自動検品PASS';cl='ok';sum='5工程完了。最終完成報告待ち'}state.textContent=s;state.className='state '+cl;summary.textContent=sum;document.querySelector('#qa').textContent=q?'✓ PASS':qa&&qa.status!=='completed'?'● RUNNING':qa?'× '+(qa.conclusion||'FAIL'):'--';document.querySelector('#dep').textContent=d?'✓ PASS':dep&&dep.status!=='completed'?'● RUNNING':dep?'× '+(dep.conclusion||'FAIL'):'--'}
async function load(){try{const r=await fetch(API,{cache:'no-store'}),j=await r.json(),rs=j.workflow_runs||[],qa=rs.find(x=>x.name==='Visual QA'),dep=rs.find(x=>x.name==='Deploy Pages');draw(qa,dep);time.textContent='最終更新 '+new Date().toLocaleString('ja-JP')+(qa?' / QA commit '+qa.head_sha.slice(0,8):'')+(dep?' / Deploy commit '+dep.head_sha.slice(0,8):'')}catch(e){state.textContent='監視取得エラー';state.className='state bad';summary.textContent=String(e)}}load();setInterval(load,15000);
</script></body></html>
