<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>つばさ 新サイト 制作進行</title><style>*{box-sizing:border-box}body{margin:0;background:#070707;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.wrap{max-width:920px;margin:auto;padding:42px 20px}h1{font-size:clamp(28px,6vw,54px);margin:0 0 8px}.sub{color:#888;margin-bottom:36px}.status{padding:22px;border:1px solid #333;background:#101010;margin-bottom:18px}.big{font-size:28px;font-weight:800}.ok{color:#4ade80}.bad{color:#fb7185}.run{color:#facc15}.bar{height:12px;background:#222;margin:18px 0;overflow:hidden}.bar i{display:block;height:100%;background:#eee;width:0;transition:.5s}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{padding:18px;background:#101010;border:1px solid #292929}.card b{display:block;font-size:18px;margin:8px 0}.muted{color:#888;font-size:12px}a{color:#fff}#err{margin-top:18px;color:#fb7185}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>味一番つばさ<br>新サイト制作進行</h1><div class="sub">GitHub Actions LIVE STATUS / 30秒自動更新</div><section class="status"><div id="overall" class="big run">取得中…</div><div class="bar"><i id="bar"></i></div><div id="summary" class="muted">最新状態を確認しています</div></section><div class="grid"><div class="card"><span class="muted">VISUAL QA</span><b id="qa">取得中</b><span id="qat" class="muted"></span></div><div class="card"><span class="muted">DEPLOY PAGES</span><b id="deploy">取得中</b><span id="deployt" class="muted"></span></div><div class="card"><span class="muted">LATEST COMMIT</span><b id="commit">取得中</b><span id="message" class="muted"></span></div><div class="card"><span class="muted">PUBLIC SITE</span><b><a href="../" target="_blank">公開サイトを開く</a></b><span class="muted">subasa-new-official</span></div></div><div id="err"></div></main><script>const API='https://api.github.com/repos/infoworks-jp/subasa-new-official/actions/runs?per_page=30';function paint(el,run){el.textContent=run?((run.status==='completed'?run.conclusion:run.status)||'unknown').toUpperCase():'NOT FOUND';el.className=run&&run.conclusion==='success'?'ok':run&&run.status!=='completed'?'run':'bad'}async function load(){try{const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw Error('GitHub API '+r.status);const d=await r.json(),runs=d.workflow_runs||[],qa=runs.find(x=>x.name==='Visual QA'),dep=runs.find(x=>x.name==='Deploy Pages'),latest=runs.find(x=>x.head_sha);paint(document.querySelector('#qa'),qa);paint(document.querySelector('#deploy'),dep);document.querySelector('#qat').textContent=qa?new Date(qa.updated_at).toLocaleString('ja-JP'):'';document.querySelector('#deployt').textContent=dep?new Date(dep.updated_at).toLocaleString('ja-JP'):'';document.querySelector('#commit').textContent=latest?latest.head_sha.slice(0,10):'-';document.querySelector('#message').textContent=latest&&latest.head_commit?latest.head_commit.message:'';let pct=0,text='制作中',cls='run';if(qa&&qa.conclusion==='success')pct+=50;if(dep&&dep.conclusion==='success')pct+=50;if((qa&&qa.conclusion==='failure')||(dep&&dep.conclusion==='failure')){text='異常検出 / 修正必要';cls='bad'}else if(pct===100){text='自動検査・公開 PASS';cls='ok'}document.querySelector('#overall').textContent=text;document.querySelector('#overall').className='big '+cls;document.querySelector('#bar').style.width=pct+'%';document.querySelector('#summary').textContent='自動工程 '+pct+'% / 最終目視確認は別途実施';document.querySelector('#err').textContent=''}catch(e){document.querySelector('#overall').textContent='監視取得エラー';document.querySelector('#overall').className='big bad';document.querySelector('#err').textContent=e.message}}load();setInterval(load,30000)</script></body></html>
