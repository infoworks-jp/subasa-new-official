name: Pavel Migration STEP 4

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  step4-emission-amount:
    name: STEP 4 / emission amount only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce STEP 4 contract
        shell: bash
        run: |
          set -euo pipefail
          test -s reference/step3-white-steam.html
          test -s reference/step4-emission-amount.html
          grep -q 'X=.632,Y=.486' reference/step4-emission-amount.html
          grep -q "color:'neutral-white'" reference/step4-emission-amount.html
          grep -q 'intervalMs:70' reference/step4-emission-amount.html
          grep -q 'resetInitialSplats:true' reference/step4-emission-amount.html
          grep -q "onlyChange:'emissionAmount'" reference/step4-emission-amount.html
          grep -q 'initFramebuffers();' reference/step4-emission-amount.html
          if grep -Eq 'config\.(SIM_RESOLUTION|DYE_RESOLUTION|DENSITY_DISSIPATION|VELOCITY_DISSIPATION|PRESSURE|PRESSURE_ITERATIONS|CURL|SPLAT_RADIUS|SPLAT_FORCE)[[:space:]]*=' reference/step4-emission-amount.html; then echo 'FAIL: physics parameter changed in STEP4'; exit 1; fi
      - name: Install browser QA
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0 pixelmatch@7.1.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Capture STEP 4 evidence
        shell: bash
        run: |
          cat > step4.mjs <<'JS'
          import { chromium } from 'playwright';import fs from 'fs';import pixelmatch from 'pixelmatch';import { PNG } from 'pngjs';
          fs.mkdirSync('step4-evidence',{recursive:true});const browser=await chromium.launch({headless:true});const report={commit:process.env.GITHUB_SHA,step:'STEP 4 emission amount only',passed:true,cases:{}};
          const diff=(a,b,out)=>{const A=PNG.sync.read(fs.readFileSync(a)),B=PNG.sync.read(fs.readFileSync(b));const D=new PNG({width:A.width,height:A.height});const n=pixelmatch(A.data,B.data,D.data,A.width,A.height,{threshold:.04,includeAA:true});fs.writeFileSync(out,PNG.sync.write(D));return n};
          for(const [name,width,height] of [['desktop',1440,1100],['mobile',390,844]]){const errors=[];const page=await browser.newPage({viewport:{width,height}});await page.goto(`https://infoworks-jp.github.io/subasa-new-official/reference/step4-emission-amount.html?qa=${process.env.GITHUB_SHA}-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});await page.waitForTimeout(2300);const state=await page.evaluate(()=>window.__pavelMigrationStep4||null);if(!state||state.onlyChange!=='emissionAmount'||state.resetInitialSplats!==true||state.intervalMs!==70)errors.push('step4-state-invalid');await page.screenshot({path:`step4-evidence/${name}-t0.png`});await page.waitForTimeout(1500);await page.screenshot({path:`step4-evidence/${name}-t1.png`});await page.waitForTimeout(1800);await page.screenshot({path:`step4-evidence/${name}-t3.png`});const d01=diff(`step4-evidence/${name}-t0.png`,`step4-evidence/${name}-t1.png`,`step4-evidence/${name}-diff01.png`);const d13=diff(`step4-evidence/${name}-t1.png`,`step4-evidence/${name}-t3.png`,`step4-evidence/${name}-diff13.png`);if(d01<300||d13<300)errors.push(`steam-motion-low:${d01}/${d13}`);report.cases[name]={state,diff01:d01,diff13:d13,errors};if(errors.length)report.passed=false;await page.close();}await browser.close();fs.writeFileSync('step4-evidence/report.json',JSON.stringify(report,null,2));if(!report.passed)process.exit(1);
          JS
          node step4.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PAVEL-MIGRATION-STEP4-${{ github.sha }}
          path: step4-evidence
          retention-days: 90
