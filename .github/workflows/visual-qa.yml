name: Tsubasa Release Manager

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tsubasa-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: 1. Contract / source integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce current source contract
        shell: bash
        run: |
          set -euo pipefail
          test -s GITHUB_MANAGER.md
          test -s index.html
          test -s style.css
          test -s fluid-top.css
          test -s app.js
          test -s effects.js
          test -s assets/susukino-top.webp
          test -s assets/tsubasa-logo.png
          grep -q 'assets/tsubasa-logo.png' index.html
          grep -q 'data-effect="steam"' index.html
          grep -q '__tsubasaEffects' effects.js
          grep -q 'コードではなく公開画面が正解' GITHUB_MANAGER.md
      - name: Protect approved PNG logo
        shell: bash
        run: |
          set -euo pipefail
          bytes=$(wc -c < assets/tsubasa-logo.png)
          test "$bytes" -ge 30000
          test "$bytes" -le 500000
          file assets/tsubasa-logo.png | grep -q 'PNG image data'
      - name: Write contract receipt
        run: |
          mkdir -p manager
          sha256sum index.html style.css fluid-top.css app.js effects.js assets/susukino-top.webp assets/tsubasa-logo.png GITHUB_MANAGER.md > manager/source-sha256.txt
          printf 'commit=%s\nstatus=CONTRACT_VERIFIED\n' "$GITHUB_SHA" > manager/contract.txt
      - uses: actions/upload-artifact@v4
        with:
          name: manager-contract-${{ github.sha }}
          path: manager
          retention-days: 30

  browser:
    name: 2. Public browser / visual behavior
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser QA
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0 pixelmatch@7.1.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Verify public logo and steam behavior on desktop and mobile
        shell: bash
        run: |
          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          import pixelmatch from 'pixelmatch';
          import { PNG } from 'pngjs';
          fs.mkdirSync('evidence',{recursive:true});
          const browser=await chromium.launch({headless:true});
          const report={commit:process.env.GITHUB_SHA,publicUrl:'https://infoworks-jp.github.io/subasa-new-official/',passed:true,cases:{}};
          const targets=[['desktop',1440,1100],['mobile',390,844]];
          const diff=(a,b,out)=>{const A=PNG.sync.read(fs.readFileSync(a)),B=PNG.sync.read(fs.readFileSync(b)); if(A.width!==B.width||A.height!==B.height)return -1; const D=new PNG({width:A.width,height:A.height}); const n=pixelmatch(A.data,B.data,D.data,A.width,A.height,{threshold:.08}); fs.writeFileSync(out,PNG.sync.write(D)); return n;};
          for (const [name,width,height] of targets) {
            const page=await browser.newPage({viewport:{width,height}});
            const errors=[];
            await page.goto(`https://infoworks-jp.github.io/subasa-new-official/?qa=${process.env.GITHUB_SHA}-${Date.now()}`,{waitUntil:'networkidle'});
            const logo=page.locator('.hero-logo'); await logo.waitFor({state:'visible',timeout:10000});
            const box=await logo.boundingBox(); const copy=await page.locator('.hero-copy').boundingBox().catch(()=>null);
            const metrics={x:box.x,y:box.y,width:box.width,height:box.height,xPct:box.x/width,yPct:box.y/height,rightGapPct:(width-(box.x+box.width))/width};
            if(name==='desktop'){
              if(metrics.xPct < .58 || metrics.xPct > .75) errors.push(`desktop-x-out:${metrics.xPct}`);
              if(metrics.yPct < .06 || metrics.yPct > .15) errors.push(`desktop-y-out:${metrics.yPct}`);
              if(metrics.rightGapPct < .15 || metrics.rightGapPct > .25) errors.push(`desktop-right-gap-out:${metrics.rightGapPct}`);
            } else {
              if(metrics.xPct < .50 || metrics.xPct > .78) errors.push(`mobile-x-out:${metrics.xPct}`);
              if(metrics.yPct < .05 || metrics.yPct > .16) errors.push(`mobile-y-out:${metrics.yPct}`);
            }
            if(copy){const overlap=!(box.x+box.width<=copy.x||copy.x+copy.width<=box.x||box.y+box.height<=copy.y||copy.y+copy.height<=box.y);if(overlap)errors.push('logo-overlaps-copy');}
            await page.screenshot({path:`evidence/${name}-hero.png`});

            const sig=page.locator('#signature'); await sig.scrollIntoViewIfNeeded(); await page.waitForTimeout(700);
            const canvas=sig.locator('canvas[data-effect="steam"]'); await canvas.waitFor({state:'visible',timeout:10000});
            const cb=await canvas.boundingBox();
            const state=await page.evaluate(()=>window.__tsubasaEffects||null);
            if(!state||!state.effects?.includes('steam')||state.canvasCount<1) errors.push('steam-runtime-missing');
            const clip={x:Math.max(0,cb.x),y:Math.max(0,cb.y),width:Math.min(width-Math.max(0,cb.x),cb.width),height:Math.min(height-Math.max(0,cb.y),cb.height)};
            await page.screenshot({path:`evidence/${name}-steam-t0.png`,clip});
            await page.waitForTimeout(1200);
            await page.screenshot({path:`evidence/${name}-steam-t1.png`,clip});
            const natural=diff(`evidence/${name}-steam-t0.png`,`evidence/${name}-steam-t1.png`,`evidence/${name}-steam-natural-diff.png`);
            if(natural<=25) errors.push(`steam-not-moving:${natural}`);
            let pointer=-2;
            if(name==='desktop'){
              const px=cb.x+cb.width*.55, py=cb.y+cb.height*.48;
              await page.mouse.move(px-120,py+30); await page.mouse.move(px,py,{steps:12}); await page.mouse.move(px+100,py-70,{steps:12}); await page.waitForTimeout(350);
              await page.screenshot({path:`evidence/${name}-steam-pointer.png`,clip});
              pointer=diff(`evidence/${name}-steam-t1.png`,`evidence/${name}-steam-pointer.png`,`evidence/${name}-steam-pointer-diff.png`);
              if(pointer<=25) errors.push(`steam-pointer-no-response:${pointer}`);
            }
            report.cases[name]={logo:metrics,steam:{runtime:state,naturalDiffPixels:natural,pointerDiffPixels:pointer},errors};
            if(errors.length)report.passed=false;
            await page.close();
          }
          await browser.close();
          fs.writeFileSync('evidence/report.json',JSON.stringify(report,null,2));
          if(!report.passed)process.exit(1);
          JS
          node qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-visual-evidence-${{ github.sha }}
          path: evidence
          retention-days: 30

  manager:
    name: 3. GitHub manager verdict
    needs: [contract, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Issue verified release verdict
        run: |
          mkdir -p manager-verdict
          printf 'commit=%s\ncontract=PASS\npublic_browser_visual=PASS\nsteam_motion=PASS\nsteam_pointer=PASS\nmanager=PASS\nrelease=VERIFIED\n' "$GITHUB_SHA" | tee manager-verdict/VERDICT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VERIFIED-${{ github.sha }}
          path: manager-verdict/VERDICT.txt
          retention-days: 90
