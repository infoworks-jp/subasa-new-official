name: Tsubasa Release Manager

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tsubasa-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: 1. Contract / source integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce current source contract
        shell: bash
        run: |
          set -euo pipefail
          test -s GITHUB_MANAGER.md
          test -s index.html
          test -s style.css
          test -s fluid-top.css
          test -s app.js
          test -s assets/susukino-top.webp
          test -s assets/tsubasa-logo.png
          grep -q 'assets/tsubasa-logo.png' index.html
          grep -q 'class="hero-logo"' index.html
          grep -q 'class="hero-bg"' index.html
          grep -q 'コードではなく公開画面が正解' GITHUB_MANAGER.md
          ! grep -q 'class="wordmark"' index.html
      - name: Protect approved PNG logo
        shell: bash
        run: |
          set -euo pipefail
          bytes=$(wc -c < assets/tsubasa-logo.png)
          echo "logo_bytes=$bytes"
          test "$bytes" -ge 30000
          test "$bytes" -le 500000
          file assets/tsubasa-logo.png | grep -q 'PNG image data'
      - name: Write contract receipt
        run: |
          mkdir -p manager
          sha256sum index.html style.css fluid-top.css app.js assets/susukino-top.webp assets/tsubasa-logo.png GITHUB_MANAGER.md > manager/source-sha256.txt
          printf 'commit=%s\nstatus=CONTRACT_VERIFIED\n' "$GITHUB_SHA" > manager/contract.txt
      - uses: actions/upload-artifact@v4
        with:
          name: manager-contract-${{ github.sha }}
          path: manager
          retention-days: 30

  browser:
    name: 2. Browser / visual behavior
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser QA
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start site
        run: |
          python3 -m http.server 4173 >/tmp/tsubasa-server.log 2>&1 &
          sleep 2
      - name: Measure actual rendered hero logo on desktop and mobile
        shell: bash
        run: |
          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('evidence',{recursive:true});
          const browser=await chromium.launch({headless:true});
          const report={commit:process.env.GITHUB_SHA,passed:true,cases:{}};
          for (const [name,width,height] of [['desktop',1440,1100],['mobile',390,844]]) {
            const page=await browser.newPage({viewport:{width,height}});
            const errors=[];
            page.on('pageerror',e=>errors.push(`pageerror:${e.message}`));
            await page.goto(`http://127.0.0.1:4173/?qa=${process.env.GITHUB_SHA}`,{waitUntil:'networkidle'});
            const logo=page.locator('.hero-logo');
            await logo.waitFor({state:'visible'});
            const box=await logo.boundingBox();
            const copy=await page.locator('.hero-copy').boundingBox();
            if(!box) errors.push('missing-logo-box');
            if(box){
              const metrics={x:box.x,y:box.y,width:box.width,height:box.height,xPct:box.x/width,yPct:box.y/height,rightGapPct:(width-(box.x+box.width))/width};
              if(name==='desktop'){
                if(metrics.xPct < .58 || metrics.xPct > .75) errors.push(`desktop-x-out:${metrics.xPct}`);
                if(metrics.yPct < .06 || metrics.yPct > .15) errors.push(`desktop-y-out:${metrics.yPct}`);
                if(metrics.rightGapPct < .15 || metrics.rightGapPct > .25) errors.push(`desktop-right-gap-out:${metrics.rightGapPct}`);
              } else {
                if(metrics.xPct < .50 || metrics.xPct > .78) errors.push(`mobile-x-out:${metrics.xPct}`);
                if(metrics.yPct < .05 || metrics.yPct > .16) errors.push(`mobile-y-out:${metrics.yPct}`);
              }
              if(copy){
                const overlap=!(box.x+box.width<=copy.x || copy.x+copy.width<=box.x || box.y+box.height<=copy.y || copy.y+copy.height<=box.y);
                if(overlap) errors.push('logo-overlaps-copy');
              }
              report.cases[name]={metrics,errors};
            } else report.cases[name]={errors};
            await page.locator('#top').screenshot({path:`evidence/${name}-hero.png`});
            if(errors.length) report.passed=false;
            await page.close();
          }
          await browser.close();
          fs.writeFileSync('evidence/report.json',JSON.stringify(report,null,2));
          if(!report.passed) process.exit(1);
          JS
          node qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-visual-evidence-${{ github.sha }}
          path: evidence
          retention-days: 30

  manager:
    name: 3. GitHub manager verdict
    needs: [contract, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Issue verified release verdict
        run: |
          mkdir -p manager-verdict
          printf 'commit=%s\ncontract=PASS\nbrowser_visual=PASS\nmanager=PASS\nrelease=VERIFIED\n' "$GITHUB_SHA" | tee manager-verdict/VERDICT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VERIFIED-${{ github.sha }}
          path: manager-verdict/VERDICT.txt
          retention-days: 90
