name: Tsubasa Release Manager

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tsubasa-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: 1. Contract / source integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce non-negotiable source contract
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s style.css
          test -s app.js
          test -s fluid-text.js
          test -s assets/susukino-top.webp
          test -s assets/tsubasa-logo.svg
          grep -q 'data-slide="assets/susukino-top.webp"' index.html
          grep -q 'three-fluid-fx' fluid-text.js
          grep -Eq 'WebGPURenderer|three/webgpu|three/tsl' fluid-text.js
          grep -q 'attachPointerSplats' fluid-text.js
          grep -q 'simpleDistortion' fluid-text.js
          grep -q 'fluidOverlay' fluid-text.js
          ! grep -Eq "getContext\\(['\"]2d['\"]" fluid-text.js
          ! grep -q 'class="wordmark"' index.html
          grep -q 'tsubasa-logo.svg' fluid-text.js
      - name: Protect supplied logo from simplification
        shell: bash
        run: |
          set -euo pipefail
          bytes=$(wc -c < assets/tsubasa-logo.svg)
          echo "logo_bytes=$bytes"
          test "$bytes" -ge 500000 || { echo 'FAIL: supplied logo was missing, replaced or simplified'; exit 1; }
          grep -q '<svg' assets/tsubasa-logo.svg
          grep -Eq '<path|<polygon|<polyline' assets/tsubasa-logo.svg
      - name: Write contract receipt
        run: |
          mkdir -p manager
          sha256sum index.html style.css app.js fluid-text.js assets/susukino-top.webp assets/tsubasa-logo.svg > manager/source-sha256.txt
          printf 'commit=%s\nstatus=CONTRACT_VERIFIED\n' "$GITHUB_SHA" > manager/contract.txt
      - uses: actions/upload-artifact@v4
        with:
          name: manager-contract-${{ github.sha }}
          path: manager
          retention-days: 30

  browser:
    name: 2. Browser / visual behavior
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser QA
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0 pixelmatch@7.1.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Start site
        run: |
          python3 -m http.server 4173 >/tmp/tsubasa-server.log 2>&1 &
          sleep 2
      - name: Prove pointer-driven TOP changes on desktop and mobile
        shell: bash
        run: |
          cat > /tmp/qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          import { PNG } from 'pngjs';
          import pixelmatch from 'pixelmatch';
          fs.mkdirSync('evidence',{recursive:true});
          const browser=await chromium.launch({headless:true});
          const report={commit:process.env.GITHUB_SHA,passed:true,cases:{}};
          for (const [name,width,height] of [['desktop',1440,1100],['mobile',390,844]]) {
            const page=await browser.newPage({viewport:{width,height}}); const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173',{waitUntil:'networkidle'});
            await page.waitForTimeout(1800);
            const stage=page.locator('#fluidTextStage');
            if(await stage.count()!==1) errors.push('missing-fluid-stage');
            await page.locator('#top').screenshot({path:`evidence/${name}-before.png`});
            await page.mouse.move(width*.18,height*.35);
            await page.mouse.move(width*.82,height*.58,{steps:28});
            await page.waitForTimeout(650);
            await page.locator('#top').screenshot({path:`evidence/${name}-after.png`});
            const a=PNG.sync.read(fs.readFileSync(`evidence/${name}-before.png`));
            const b=PNG.sync.read(fs.readFileSync(`evidence/${name}-after.png`));
            const diff=new PNG({width:a.width,height:a.height});
            const pixels=pixelmatch(a.data,b.data,diff.data,a.width,a.height,{threshold:0.1});
            fs.writeFileSync(`evidence/${name}-diff.png`,PNG.sync.write(diff));
            const ratio=pixels/(a.width*a.height);
            if(ratio<0.0005) errors.push(`pointer-effect-not-visible:${ratio}`);
            report.cases[name]={changedPixels:pixels,ratio,errors};
            if(errors.length) report.passed=false;
            await page.close();
          }
          await browser.close();
          fs.writeFileSync('evidence/report.json',JSON.stringify(report,null,2));
          if(!report.passed) process.exit(1);
          JS
          node /tmp/qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-visual-evidence-${{ github.sha }}
          path: evidence
          retention-days: 30

  manager:
    name: 3. GitHub manager verdict
    needs: [contract, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Issue verified release verdict
        run: |
          mkdir -p manager-verdict
          printf 'commit=%s\ncontract=PASS\nbrowser_visual=PASS\nmanager=PASS\nrelease=VERIFIED\n' "$GITHUB_SHA" | tee manager-verdict/VERDICT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VERIFIED-${{ github.sha }}
          path: manager-verdict/VERDICT.txt
          retention-days: 90
