name: Visual QA

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  spec-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write immutable Fluid Text contract checker
        run: |
          cat > /tmp/spec-gate.py <<'PY'
          from pathlib import Path
          import sys
          errors=[]
          idx=Path('index.html').read_text()
          js=Path('fluid-text.js').read_text() if Path('fluid-text.js').exists() else ''
          required=[
            ('slide-image', 'data-slide="assets/susukino-top.webp"' in idx),
            ('fluid-script', '<script src="fluid-text.js"></script>' in idx),
            ('three-fluid-fx-import', 'three-fluid-fx' in js),
            ('three-tsl-or-webgpu', ('WebGPURenderer' in js or 'three/tsl' in js or 'tsl' in js.lower())),
            ('slideshow-texture', ('Slideshow' in js and 'susukino-top.webp' in js)),
            ('fluid-distortion', ('simpleDistortion' in js or 'fluid.densityNode' in js)),
            ('pointer-to-fluid', ('pointer' in js.lower() and ('fluid' in js.lower() or 'splat' in js.lower())),
          ]
          forbidden=[
            ('canvas2d-fake-fluid', "getContext('2d'" not in js and 'getContext("2d"' not in js),
          ]
          for name,ok in required+forbidden:
            if not ok: errors.append(name)
          if errors:
            print('SPEC_GATE_FAIL:', ','.join(errors)); sys.exit(1)
          print('SPEC_GATE_PASS')
          PY
      - name: Negative self-test must reject current known-bad implementation
        run: |
          set +e
          python3 /tmp/spec-gate.py
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'NEGATIVE_SELF_TEST_FAIL: checker accepted known-bad Canvas2D substitute'
            exit 1
          fi
          echo 'NEGATIVE_SELF_TEST_PASS: checker rejected known-bad implementation as required'
      - name: Enforce contract on repository
        run: python3 /tmp/spec-gate.py

  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Require installed assets
        shell: bash
        run: |
          set -euo pipefail
          for f in assets/ultimate-miso.webp assets/tsubasa-ramen.webp assets/susukino-top.webp assets/store-interior.webp assets/menu-ja.webp assets/menu-en.webp assets/menu-zh.webp assets/menu-ko.webp assets/logo-vertical.svg; do test -s "$f"; done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify static contract
        run: |
          set -euo pipefail
          test -f index.html && test -f style.css && test -f app.js && test -f fluid-text.js
          grep -q '究極の' index.html
          grep -q 'つばさ<br>ラーメン' index.html
          grep -q '11:00 — 03:00' index.html
          grep -q '毎週月曜日 定休' index.html
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          python3 -m http.server 4173 >/tmp/server.log 2>&1 &
          sleep 2
      - name: Browser QA and screenshots
        run: |
          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright'; import fs from 'fs';
          fs.mkdirSync('qa',{recursive:true}); const browser=await chromium.launch({headless:true});
          const report={passed:true,cases:{}};
          for(const [name,width,height] of [['desktop',1440,1100],['mobile',390,844]]){
            const page=await browser.newPage({viewport:{width,height}}),bad=[];
            page.on('pageerror',e=>bad.push('pageerror:'+e.message));
            await page.goto('http://127.0.0.1:4173',{waitUntil:'networkidle'}); await page.waitForTimeout(1200);
            const stage=page.locator('#fluidTextStage'); if(await stage.count()!==1) bad.push('missing-fluid-stage');
            const slide=await stage.getAttribute('data-slide'); if(slide!=='assets/susukino-top.webp') bad.push('wrong-slide:'+slide);
            await page.mouse.move(width*.25,height*.4); await page.mouse.move(width*.7,height*.55,{steps:12}); await page.waitForTimeout(500);
            await page.screenshot({path:`qa/${name}-full.png`,fullPage:true}); await page.locator('#top').screenshot({path:`qa/${name}-top.png`});
            report.cases[name]={bad}; if(bad.length)report.passed=false; await page.close();
          }
          await browser.close(); fs.writeFileSync('qa/report.json',JSON.stringify(report,null,2)); if(!report.passed)process.exit(1);
          JS
          node qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tsubasa-visual-qa
          path: qa
          retention-days: 14
