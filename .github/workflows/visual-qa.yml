name: Tsubasa Release Manager

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tsubasa-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: 1. Contract / source integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce current source contract
        shell: bash
        run: |
          set -euo pipefail
          test -s GITHUB_MANAGER.md
          test -s index.html
          test -s style.css
          test -s fluid-top.css
          test -s app.js
          test -s effects.js
          test -s assets/susukino-top.webp
          test -s assets/tsubasa-logo.png
          grep -q 'assets/tsubasa-logo.png' index.html
          grep -q 'data-effect="steam"' index.html
          grep -q '__tsubasaEffects' effects.js
          grep -q 'コードではなく公開画面が正解' GITHUB_MANAGER.md
      - name: Protect approved PNG logo
        shell: bash
        run: |
          set -euo pipefail
          bytes=$(wc -c < assets/tsubasa-logo.png)
          test "$bytes" -ge 30000
          test "$bytes" -le 500000
          file assets/tsubasa-logo.png | grep -q 'PNG image data'
      - name: Write contract receipt
        run: |
          mkdir -p manager
          sha256sum index.html style.css fluid-top.css app.js effects.js assets/susukino-top.webp assets/tsubasa-logo.png GITHUB_MANAGER.md > manager/source-sha256.txt
          printf 'commit=%s\nstatus=CONTRACT_VERIFIED\n' "$GITHUB_SHA" > manager/contract.txt
      - uses: actions/upload-artifact@v4
        with:
          name: manager-contract-${{ github.sha }}
          path: manager
          retention-days: 30

  browser:
    name: 2. Public browser / composite visual / performance
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser QA
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0 pixelmatch@7.1.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Verify public composition, steam behavior and scroll performance
        shell: bash
        run: |
          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright';import fs from 'fs';import pixelmatch from 'pixelmatch';import { PNG } from 'pngjs';
          fs.mkdirSync('evidence',{recursive:true});const browser=await chromium.launch({headless:true});const report={commit:process.env.GITHUB_SHA,publicUrl:'https://infoworks-jp.github.io/subasa-new-official/',passed:true,cases:{}};
          const targets=[['desktop',1440,1100],['mobile',390,844]];
          const saveCanvas=async(page,selector,path)=>{const data=await page.$eval(selector,c=>c.toDataURL('image/png').split(',')[1]);fs.writeFileSync(path,Buffer.from(data,'base64'));};
          const stats=path=>{const p=PNG.sync.read(fs.readFileSync(path));let active=0,alpha=0;for(let i=0;i<p.data.length;i+=4){const a=p.data[i+3];alpha+=a;if(a>8&&(p.data[i]+p.data[i+1]+p.data[i+2])>30)active++;}return{width:p.width,height:p.height,activePixels:active,alphaSum:alpha};};
          const diff=(a,b,out)=>{const A=PNG.sync.read(fs.readFileSync(a)),B=PNG.sync.read(fs.readFileSync(b));if(A.width!==B.width||A.height!==B.height)return -1;const D=new PNG({width:A.width,height:A.height});const n=pixelmatch(A.data,B.data,D.data,A.width,A.height,{threshold:.03,includeAA:true});fs.writeFileSync(out,PNG.sync.write(D));return n;};
          for(const [name,width,height] of targets){const errors=[];const page=await browser.newPage({viewport:{width,height}});page.on('pageerror',e=>errors.push(`pageerror:${e.message}`));await page.goto(`https://infoworks-jp.github.io/subasa-new-official/?qa=full-${process.env.GITHUB_SHA}-${Date.now()}`,{waitUntil:'networkidle'});
            const logo=page.locator('.hero-logo');await logo.waitFor({state:'visible',timeout:10000});const box=await logo.boundingBox();const copy=await page.locator('.hero-copy').boundingBox().catch(()=>null);const metrics={x:box.x,y:box.y,width:box.width,height:box.height,xPct:box.x/width,yPct:box.y/height,rightGapPct:(width-(box.x+box.width))/width};
            if(name==='desktop'){if(metrics.xPct<.58||metrics.xPct>.75)errors.push(`desktop-x-out:${metrics.xPct}`);if(metrics.yPct<.06||metrics.yPct>.15)errors.push(`desktop-y-out:${metrics.yPct}`)}else{if(metrics.xPct<.50||metrics.xPct>.78)errors.push(`mobile-x-out:${metrics.xPct}`);if(metrics.yPct<.05||metrics.yPct>.16)errors.push(`mobile-y-out:${metrics.yPct}`)}if(copy){const overlap=!(box.x+box.width<=copy.x||copy.x+copy.width<=box.x||box.y+box.height<=copy.y||copy.y+copy.height<=box.y);if(overlap)errors.push('logo-overlaps-copy')}await page.locator('#top').screenshot({path:`evidence/${name}-hero.png`,animations:'disabled'});
            const sig=page.locator('#signature');await sig.scrollIntoViewIfNeeded();await page.waitForTimeout(800);const canvas=sig.locator('canvas[data-effect="steam"]');await canvas.waitFor({state:'visible',timeout:10000});const cb=await canvas.boundingBox();const state=await page.evaluate(()=>window.__tsubasaEffects||null);if(!state||!state.effects?.includes('steam')||state.canvasCount<1)errors.push('steam-runtime-missing');
            await sig.screenshot({path:`evidence/${name}-signature-composite.png`});await saveCanvas(page,'#signature canvas[data-effect="steam"]',`evidence/${name}-steam-t0.png`);await page.waitForTimeout(1200);await saveCanvas(page,'#signature canvas[data-effect="steam"]',`evidence/${name}-steam-t1.png`);const s0=stats(`evidence/${name}-steam-t0.png`),s1=stats(`evidence/${name}-steam-t1.png`);const natural=diff(`evidence/${name}-steam-t0.png`,`evidence/${name}-steam-t1.png`,`evidence/${name}-steam-natural-diff.png`);if(s0.activePixels<100||s1.activePixels<100)errors.push(`steam-blank:${s0.activePixels}/${s1.activePixels}`);if(natural<=25)errors.push(`steam-not-moving:${natural}`);
            let pointer=-2;if(name==='desktop'){const px=cb.x+cb.width*.55,py=cb.y+cb.height*.48;await page.mouse.move(px-120,py+30);await page.mouse.move(px,py,{steps:12});await page.mouse.move(px+100,py-70,{steps:12});await page.waitForTimeout(400);await saveCanvas(page,'#signature canvas[data-effect="steam"]',`evidence/${name}-steam-pointer.png`);pointer=diff(`evidence/${name}-steam-t1.png`,`evidence/${name}-steam-pointer.png`,`evidence/${name}-steam-pointer-diff.png`);if(pointer<=25)errors.push(`steam-pointer-no-response:${pointer}`)}
            const perf=await page.evaluate(async()=>{const samples=[];let prev=performance.now();for(let i=0;i<90;i++){scrollTo(0,(document.documentElement.scrollHeight-innerHeight)*(i/89));await new Promise(r=>requestAnimationFrame(t=>{samples.push(t-prev);prev=t;r()}));}scrollTo(0,0);samples.sort((a,b)=>a-b);const avg=samples.reduce((a,b)=>a+b,0)/samples.length,p95=samples[Math.floor(samples.length*.95)],max=samples[samples.length-1];return{avgFrameMs:avg,p95FrameMs:p95,maxFrameMs:max,longFrames:samples.filter(x=>x>50).length};});if(perf.avgFrameMs>35||perf.p95FrameMs>65||perf.longFrames>12)errors.push(`scroll-perf:${JSON.stringify(perf)}`);
            report.cases[name]={logo:metrics,steam:{runtime:state,box:cb,t0:s0,t1:s1,naturalDiffPixels:natural,pointerDiffPixels:pointer},performance:perf,errors};if(errors.length)report.passed=false;await page.close();}
          await browser.close();fs.writeFileSync('evidence/report.json',JSON.stringify(report,null,2));if(!report.passed)process.exit(1);
          JS
          node qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-visual-evidence-${{ github.sha }}
          path: evidence
          retention-days: 30

  manager:
    name: 3. GitHub manager verdict
    needs: [contract, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Issue verified release verdict
        run: |
          mkdir -p manager-verdict
          printf 'commit=%s\ncontract=PASS\npublic_browser_visual=PASS\nsteam_composite=PASS\nsteam_motion=PASS\nsteam_pointer=PASS\nscroll_performance=PASS\nmanager=PASS\nrelease=VERIFIED\n' "$GITHUB_SHA" | tee manager-verdict/VERDICT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VERIFIED-${{ github.sha }}
          path: manager-verdict/VERDICT.txt
          retention-days: 90
