name: Pavel Migration STEP 6

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  step6-pointer-interaction:
    name: STEP 6 / pointer interaction only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce STEP 6 contract
        shell: bash
        run: |
          set -euo pipefail
          test -s reference/step5-velocity-vorticity-diffusion.html
          test -s reference/step6-pointer-interaction.html
          grep -q 'X=.632,Y=.486' reference/step6-pointer-interaction.html
          grep -q 'DYE_AMPLITUDE=.03' reference/step6-pointer-interaction.html
          grep -q 'EMIT_INTERVAL_MS=150' reference/step6-pointer-interaction.html
          grep -q 'UPWARD_FORCE=10' reference/step6-pointer-interaction.html
          grep -q 'LATERAL_FORCE=1.2' reference/step6-pointer-interaction.html
          grep -q 'DENSITY_DISSIPATION=3.2' reference/step6-pointer-interaction.html
          grep -q 'VELOCITY_DISSIPATION=1.0' reference/step6-pointer-interaction.html
          grep -q 'CURL_STRENGTH=24' reference/step6-pointer-interaction.html
          grep -q 'SPLAT_RADIUS=.04' reference/step6-pointer-interaction.html
          grep -q 'const noDye={r:0,g:0,b:0}' reference/step6-pointer-interaction.html
          grep -q 'splat(x,y,vx,vy,noDye)' reference/step6-pointer-interaction.html
          grep -q 'pointerAddsDye:false' reference/step6-pointer-interaction.html
          grep -q "onlyChange:'pointerInteraction'" reference/step6-pointer-interaction.html
          if grep -Eq 'config\.(SIM_RESOLUTION|DYE_RESOLUTION|PRESSURE|PRESSURE_ITERATIONS|SPLAT_FORCE|BLOOM|SUNRAYS)[[:space:]]*=' reference/step6-pointer-interaction.html; then echo 'FAIL: STEP6 changed a non-pointer solver setting'; exit 1; fi
      - name: Install browser QA
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0 pixelmatch@7.1.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Capture STEP 6 evidence
        shell: bash
        run: |
          cat > step6.mjs <<'JS'
          import { chromium } from 'playwright';import fs from 'fs';import pixelmatch from 'pixelmatch';import { PNG } from 'pngjs';
          fs.mkdirSync('step6-evidence',{recursive:true});const browser=await chromium.launch({headless:true});const report={commit:process.env.GITHUB_SHA,step:'STEP 6 pointer interaction only',passed:true,cases:{}};
          const diff=(a,b,out)=>{const A=PNG.sync.read(fs.readFileSync(a)),B=PNG.sync.read(fs.readFileSync(b));const D=new PNG({width:A.width,height:A.height});const n=pixelmatch(A.data,B.data,D.data,A.width,A.height,{threshold:.035,includeAA:true});fs.writeFileSync(out,PNG.sync.write(D));return n};
          const captureCanvasOnly=async(page,path)=>{await page.evaluate(()=>{const c=document.querySelector('canvas');document.body.style.background='#000';c.style.mixBlendMode='normal';c.style.background='#000';});await page.locator('canvas').screenshot({path});await page.evaluate(()=>{const c=document.querySelector('canvas');document.body.style.background='';c.style.mixBlendMode='';c.style.background='';});};
          for(const [name,width,height] of [['desktop',1440,1100],['mobile',390,844]]){const errors=[];const page=await browser.newPage({viewport:{width,height}});page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text().slice(0,180));});await page.goto(`https://infoworks-jp.github.io/subasa-new-official/reference/step6-pointer-interaction.html?qa=${process.env.GITHUB_SHA}-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});await page.waitForTimeout(4700);const state0=await page.evaluate(()=>window.__pavelMigrationStep6?{...window.__pavelMigrationStep6,pointerSplats:window.__pavelMigrationStep6.pointerSplats}:null);if(!state0||state0.onlyChange!=='pointerInteraction'||state0.pointerAddsDye!==false||state0.upstreamSplat!==true||state0.dyeAmplitude!==.03||state0.splatRadius!==.04)errors.push('step6-state-invalid');await page.screenshot({path:`step6-evidence/${name}-before.png`});await captureCanvasOnly(page,`step6-evidence/${name}-canvas-before.png`);
            if(name==='desktop'){
              await page.mouse.move(width*.50,height*.45);for(let k=1;k<=18;k++){await page.mouse.move(width*(.50+.22*k/18),height*(.45-.055*Math.sin(k*.55)),{steps:1});await page.waitForTimeout(18);}
            }else{
              await page.evaluate(({w,h})=>{const c=document.querySelector('canvas');for(let k=0;k<=18;k++){const x=w*(.48+.24*k/18),y=h*(.46-.05*Math.sin(k*.55));c.dispatchEvent(new PointerEvent('pointermove',{bubbles:true,clientX:x,clientY:y,pointerType:'touch',pointerId:7}));}},{w:width,h:height});
            }
            await page.waitForTimeout(180);const state1=await page.evaluate(()=>({pointerSplats:window.__pavelMigrationStep6.pointerSplats,pointerAddsDye:window.__pavelMigrationStep6.pointerAddsDye}));await page.screenshot({path:`step6-evidence/${name}-after180.png`});await captureCanvasOnly(page,`step6-evidence/${name}-canvas-after180.png`);await page.waitForTimeout(850);await page.screenshot({path:`step6-evidence/${name}-after1030.png`});await captureCanvasOnly(page,`step6-evidence/${name}-canvas-after1030.png`);const dNow=diff(`step6-evidence/${name}-canvas-before.png`,`step6-evidence/${name}-canvas-after180.png`,`step6-evidence/${name}-pointer-diff-now.png`);const dAfter=diff(`step6-evidence/${name}-canvas-before.png`,`step6-evidence/${name}-canvas-after1030.png`,`step6-evidence/${name}-pointer-diff-after.png`);const minSplats=name==='desktop'?8:8;const minDiff=Math.max(20,Math.round(220*(width*height)/(1440*1100)));if(state1.pointerSplats<minSplats)errors.push(`pointer-splats-low:${state1.pointerSplats}`);if(state1.pointerAddsDye!==false)errors.push('pointer-added-dye');if(dNow<minDiff||dAfter<minDiff)errors.push(`pointer-visual-response-low:${dNow}/${dAfter}<${minDiff}`);report.cases[name]={state0,state1,minSplats,minDiff,diffNow:dNow,diffAfter:dAfter,errors};if(errors.length)report.passed=false;await page.close();}
          await browser.close();fs.writeFileSync('step6-evidence/report.json',JSON.stringify(report,null,2));if(!report.passed)process.exit(1);
          JS
          node step6.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PAVEL-MIGRATION-STEP6-${{ github.sha }}
          path: step6-evidence
          retention-days: 90
