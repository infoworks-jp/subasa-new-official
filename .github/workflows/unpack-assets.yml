name: Unpack assets
on:
  push:
    paths:
      - '.github/workflows/unpack-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack uploaded asset pack
        run: |
          set -euo pipefail
          rm -rf assets
          mkdir -p assets
          unzip -o tsubasa-assets-pack.zip -d assets
          echo '--- extracted files ---'
          find assets -type f -maxdepth 3 -print
          test "$(find assets -type f | wc -l)" -gt 0
      - name: Commit extracted assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets
          if git diff --cached --quiet; then
            echo 'No asset changes'
          else
            git commit -m 'Extract official Tsubasa asset pack'
            git push
          fi
