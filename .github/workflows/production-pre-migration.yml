name: Production Steam Pre-Migration Baseline

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    name: Capture current public production steam baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser QA
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0 pixelmatch@7.1.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Capture public baseline
        shell: bash
        run: |
          cat > capture-pre.mjs <<'JS'
          import {chromium} from 'playwright';
          import fs from 'fs';
          import pixelmatch from 'pixelmatch';
          import {PNG} from 'pngjs';
          fs.mkdirSync('production-pre-evidence',{recursive:true});
          const browser=await chromium.launch({headless:true});
          const report={commit:process.env.GITHUB_SHA,publicUrl:'https://infoworks-jp.github.io/subasa-new-official/',cases:{}};
          const diff=(a,b,out)=>{const A=PNG.sync.read(fs.readFileSync(a)),B=PNG.sync.read(fs.readFileSync(b));const D=new PNG({width:A.width,height:A.height});const n=pixelmatch(A.data,B.data,D.data,A.width,A.height,{threshold:.035,includeAA:true});fs.writeFileSync(out,PNG.sync.write(D));return n};
          for(const [name,w,h] of [['desktop',1440,1100],['mobile',390,844]]){
            const page=await browser.newPage({viewport:{width:w,height:h}});const errors=[];page.on('console',m=>{if(m.type()==='error')errors.push(m.text().slice(0,180));});
            await page.goto(`https://infoworks-jp.github.io/subasa-new-official/?pre=${process.env.GITHUB_SHA}-${Date.now()}`,{waitUntil:'networkidle',timeout:45000});
            const section=page.locator('.signature-tsubasa');await section.scrollIntoViewIfNeeded();await page.waitForTimeout(900);
            const bounds=await section.boundingBox();const canvases=await page.locator('.signature-tsubasa canvas.fx-steam').count();const runtime=await page.evaluate(()=>window.__tsubasaEffects||null);
            await section.screenshot({path:`production-pre-evidence/${name}-section-t0.png`});await page.waitForTimeout(1300);await section.screenshot({path:`production-pre-evidence/${name}-section-t1.png`});
            const motion=diff(`production-pre-evidence/${name}-section-t0.png`,`production-pre-evidence/${name}-section-t1.png`,`production-pre-evidence/${name}-section-diff.png`);
            report.cases[name]={bounds,canvases,runtime,motion,errors};await page.close();
          }
          await browser.close();fs.writeFileSync('production-pre-evidence/report.json',JSON.stringify(report,null,2));
          JS
          node capture-pre.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: PRODUCTION-PRE-MIGRATION-${{ github.sha }}
          path: production-pre-evidence
          retention-days: 90
