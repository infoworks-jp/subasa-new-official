name: Pavel Migration STEP 3

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  step3-white-steam:
    name: STEP 3 / color only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce STEP 3 contract
        shell: bash
        run: |
          set -euo pipefail
          test -s reference/step2-source-position.html
          test -s reference/step3-white-steam.html
          grep -q 'X=.632,Y=.486' reference/step3-white-steam.html
          grep -q "onlyChange:'color'" reference/step3-white-steam.html
          grep -q 'config.COLORFUL=false' reference/step3-white-steam.html
          grep -q 'r:.15,g:.15,b:.15' reference/step3-white-steam.html
          grep -q "visualFilter:'none'" reference/step3-white-steam.html
          if grep -Eq 'filter:[^;]*(grayscale|brightness)' reference/step3-white-steam.html; then echo 'FAIL: global canvas color filter is forbidden in STEP3'; exit 1; fi
          if grep -Eq 'config\.(SIM_RESOLUTION|DYE_RESOLUTION|DENSITY_DISSIPATION|VELOCITY_DISSIPATION|PRESSURE|PRESSURE_ITERATIONS|CURL|SPLAT_RADIUS|SPLAT_FORCE)[[:space:]]*=' reference/step3-white-steam.html; then echo 'FAIL: non-color fluid parameter changed in STEP3'; exit 1; fi
      - name: Install browser QA
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0 pixelmatch@7.1.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Capture STEP 3 evidence
        shell: bash
        run: |
          cat > step3.mjs <<'JS'
          import { chromium } from 'playwright';import fs from 'fs';import pixelmatch from 'pixelmatch';import { PNG } from 'pngjs';
          fs.mkdirSync('step3-evidence',{recursive:true});const browser=await chromium.launch({headless:true});const report={commit:process.env.GITHUB_SHA,step:'STEP 3 color only',passed:true,cases:{}};
          const diff=(a,b,out)=>{const A=PNG.sync.read(fs.readFileSync(a)),B=PNG.sync.read(fs.readFileSync(b));const D=new PNG({width:A.width,height:A.height});const n=pixelmatch(A.data,B.data,D.data,A.width,A.height,{threshold:.04,includeAA:true});fs.writeFileSync(out,PNG.sync.write(D));return n};
          const localNeutralRatio=(path,xp,yp)=>{const P=PNG.sync.read(fs.readFileSync(path));const cx=Math.round(P.width*xp),cy=Math.round(P.height*yp),r=Math.max(10,Math.round(P.width*.018));let good=0,total=0;for(let y=Math.max(0,cy-r);y<Math.min(P.height,cy+r);y++)for(let x=Math.max(0,cx-r);x<Math.min(P.width,cx+r);x++){const i=(y*P.width+x)*4,R=P.data[i],G=P.data[i+1],B=P.data[i+2],mx=Math.max(R,G,B),mn=Math.min(R,G,B),br=(R+G+B)/3;if(br>120&&mx-mn<24)good++;total++;}return total?good/total:0};
          for(const [name,width,height] of [['desktop',1440,1100],['mobile',390,844]]){const errors=[];const page=await browser.newPage({viewport:{width,height}});await page.goto(`https://infoworks-jp.github.io/subasa-new-official/reference/step3-white-steam.html?qa=${process.env.GITHUB_SHA}-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});await page.waitForTimeout(3200);const state=await page.evaluate(()=>window.__pavelMigrationStep3||null);if(!state||state.onlyChange!=='color'||state.color!=='neutral-white'||state.visualFilter!=='none')errors.push('step3-state-invalid');await page.screenshot({path:`step3-evidence/${name}-t0.png`});await page.waitForTimeout(1500);await page.screenshot({path:`step3-evidence/${name}-t1.png`});const d=diff(`step3-evidence/${name}-t0.png`,`step3-evidence/${name}-t1.png`,`step3-evidence/${name}-diff.png`);const nr=localNeutralRatio(`step3-evidence/${name}-t1.png`,.632,.486);if(d<500)errors.push(`steam-motion-low:${d}`);if(nr<.55)errors.push(`measured-source-not-neutral-white:${nr}`);report.cases[name]={state,diffPixels:d,measuredSourceNeutralRatio:nr,errors};if(errors.length)report.passed=false;await page.close();}await browser.close();fs.writeFileSync('step3-evidence/report.json',JSON.stringify(report,null,2));if(!report.passed)process.exit(1);
          JS
          node step3.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PAVEL-MIGRATION-STEP3-${{ github.sha }}
          path: step3-evidence
          retention-days: 90
