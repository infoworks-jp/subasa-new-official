<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Steam Lab — WebGL Fluid Enhanced</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
#stage{position:fixed;inset:0;overflow:hidden;background:#000;isolation:isolate}
#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:66% 50%;user-select:none;-webkit-user-drag:none}
#simulation{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;pointer-events:none;mix-blend-mode:screen;background:transparent!important}
#fluid{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;background:transparent!important}
#gesture{position:absolute;left:0;right:0;top:22%;bottom:8%;touch-action:none;cursor:grab}#gesture:active{cursor:grabbing}
#root{position:absolute;width:8px;height:8px;border:1px solid rgba(255,255,255,.4);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity .2s}
#stage.debug #root{opacity:1}#status{position:absolute;left:8px;bottom:calc(8px + env(safe-area-inset-bottom));padding:4px 6px;border-radius:4px;background:rgba(0,0,0,.48);color:rgba(255,255,255,.62);font-size:9px;pointer-events:none}
</style>
</head>
<body>
<div id="stage"><img id="photo" src="../assets/ultimate-miso.webp" width="1440" height="960" alt="究極の味噌ラーメン"><div id="simulation"><canvas id="fluid"></canvas></div><div id="gesture" aria-label="湯気を指で動かす領域"></div><i id="root" aria-hidden="true"></i><div id="status">Enhanced 0.8.0</div></div>
<script type="module" src="enhanced.js"></script>
</body>
</html>
