<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Steam Lab — Pavel / Enhanced 比較</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#0a0a0a;color:#fff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0a0a0a}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 16px;border-bottom:1px solid #292929;background:#111}
h1{margin:0;font-size:15px;letter-spacing:.04em}.hint{margin:0;color:#aaa;font-size:11px;line-height:1.45;text-align:right}
main{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#343434;min-height:calc(100vh - 60px)}
.case{min-width:0;background:#111;display:flex;flex-direction:column}.label{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;font-size:12px}.label b{font-size:13px}.label span{color:#9b9b9b;font-size:10px}
.viewport{position:relative;flex:1;min-height:560px;background:#000;overflow:hidden}.viewport iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
footer{padding:12px 16px;color:#999;background:#111;font-size:10px;line-height:1.6;border-top:1px solid #292929}
@media(max-width:620px){header{align-items:flex-start;padding:10px 12px}.hint{max-width:180px}.label{padding:8px}.label span{display:none}main{min-height:520px}.viewport{min-height:520px}footer{padding:10px 12px}}
</style>
</head>
<body>
<header><h1>STEAM LAB / A–B</h1><p class="hint">湯気を横へドラッグして比較<br>縦スワイプはページスクロール</p></header>
<main>
  <section class="case"><div class="label"><b>Pavel / 現行</b><span>current solver / aligned root</span></div><div class="viewport"><iframe title="Pavel版 湯気" src="./?compare=1"></iframe></div></section>
  <section class="case"><div class="label"><b>Enhanced / 検証</b><span>WebGL Fluid Enhanced 0.8.0</span></div><div class="viewport"><iframe title="Enhanced版 湯気" src="enhanced.html"></iframe></div></section>
</main>
<footer>条件: ultimate-miso.webp / object-fit: cover / object-position: 66% 50% / 画像内基準点 (930, 590) / Bloom・Sunraysなし</footer>
</body>
</html>
